  // One call per 60 Hz frame: frame(f, events) -> that frame's APU register writes, flat [addr, value, ...].
  function makeDriver(mute) {
    const mu = mute || {};
    let song = null;
    let sf = 0;
    let paused = false; // the game's pause (S3): the song holds sf and is silent; effects play on
    let started = false;
    const fx = { p1: null, p2: null, t: null, n: null };
    const wasFx = { p1: false, p2: false, t: false, n: false };
    const hiShadow = [-1, -1];
    const swOn = [false, false];
    let triOn = false;
    let triHi = -1;
    function pulse(w, c, st) {
      const b = 0x4000 + 4 * c;
      if (!st || !(st.v > 0)) {
        w.push(b, 0x30); // constant volume 0, length halted
        if (swOn[c] && !(st && st.sw)) {
          w.push(b + 1, 0x08);
          swOn[c] = false;
        }
        return;
      }
      w.push(b, (st.d << 6) | 0x30 | st.v);
      if (st.sw) {
        if (st.trig) {
          w.push(b + 1, 0x80 | (st.sw.p << 4) | (st.sw.n ? 8 : 0) | st.sw.s);
          swOn[c] = true;
        }
      } else if (swOn[c]) {
        w.push(b + 1, 0x08); // sweep off, negate on: low notes are never muted by the sweep unit
        swOn[c] = false;
      }
      if (st.t !== undefined) {
        const hi = st.t >> 8;
        w.push(b + 2, st.t & 0xff);
        if (st.trig || hi !== hiShadow[c]) {
          w.push(b + 3, 0xf8 | hi); // restarts the phase: only on a new note or a new high byte
          hiShadow[c] = hi;
        }
      } else if (st.trig) hiShadow[c] = -1;
    }
    function tri(w, st) {
      if (!st) {
        if (triOn) w.push(0x4008, 0x80); // reload 0: the linear counter stops the triangle next quarter frame
        triOn = false;
        return;
      }
      if (!triOn) w.push(0x4008, 0xff);
      const hi = st.t >> 8;
      w.push(0x400a, st.t & 0xff);
      if (st.trig || hi !== triHi || !triOn) {
        w.push(0x400b, 0xf8 | hi);
        triHi = hi;
      }
      triOn = true;
    }
    function noise(w, st) {
      if (!st || !(st.v > 0)) {
        w.push(0x400c, 0x30);
        return;
      }
      w.push(0x400c, 0x30 | st.v, 0x400e, (st.m ? 0x80 : 0) | st.i);
      if (st.trig) w.push(0x400f, 0xf8);
    }
    function frame(f, evs) {
      const w = [];
      if (!started) {
        w.push(0x4015, 0x0f, 0x4001, 0x08, 0x4005, 0x08, 0x4000, 0x30, 0x4004, 0x30, 0x4008, 0x80, 0x400c, 0x30, 0x4010, 0x0f);
        started = true;
      }
      let dmcStop = false;
      let fresh = false;
      let resume = false;
      for (const ev of evs) {
        if (ev.type === 'song') {
          if (mu.music) continue;
          song = SONGS[ev.id] || null;
          // a section starts the song at that row (overworld: 'intro', 'A' the hook, 'B'); unknown: the top
          sf = song && ev.section && song.sections[ev.section] != null ? song.sections[ev.section] : 0;
          dmcStop = true;
          fresh = true;
          paused = false; // a song event always clears the pause
          resume = false;
          continue;
        }
        // The game's pause (live only): the song holds its frame and its voices go silent (the DMC
        // stops at once); effects keep running, so the pause jingle and the menu ticks sound. Unpause
        // brings every voice back on the same song frame with a fresh trigger: the same bar, in time.
        if (ev.type === 'pause' && !paused) {
          paused = true;
          resume = false;
          dmcStop = true;
        } else if (ev.type === 'unpause' && paused) {
          paused = false;
          resume = true;
        }
        if (mu.sfx) continue;
        const make = SFX[ev.type];
        if (!make) continue;
        const prog = make(ev);
        for (const ch of ['p1', 'p2', 't', 'n']) {
          if (!prog[ch] || !prog[ch].length) continue;
          // a higher priority holds the channel; so does an equal one that started on this same frame
          // (a jump and a kick together: the jump keeps pulse 2, the kick sounds on its other channels)
          const cur = fx[ch];

          fx[ch] = { prog: prog[ch], k: 0, pri: prog.pri, f };
        }

      for (const ch of ['p1', 'p2', 't', 'n']) {
        const a = fx[ch];
        let st;
        if (a) {
          st = a.prog[a.k];
          a.k++;
          if (a.k >= a.prog.length) fx[ch] = null;
        } else {
          st = song && !paused ? voiceAt(song, ch, sf) : null;
          // the song's voice comes back in time, with a fresh trigger so its registers are all rewritten;
          // a song started at a section may begin inside a note, which is triggered the same way, and so
          // does every voice on the frame the pause ends
          if ((wasFx[ch] || fresh || resume) && st) st = Object.assign({}, st, { trig: true });
        }
        wasFx[ch] = !!a;
        if (ch === 'p1') pulse(w, 0, st);
        else if (ch === 'p2') pulse(w, 1, st);
        else if (ch === 't') tri(w, st);
        else noise(w, st);

      // never leaves the channel's DC (and the triangle and noise volumes it sets) off for the next song
      if (dmcStop) w.push(0x4015, 0x0f, 0x4011, DMC_LEVEL0);

    const state = () => ({ song: song ? song.id : null, sf, paused });

  }

  const NONE = [];
  // A game's sim events when a game is loaded (FILM.game.events()), else the film's cues: a `song` cue
  // switches the song at its section, any other kind fires sfx[kind]; t seconds -> frame round(t * 60).
  function gameEvents() {
    const g = FILM.game;
    if (g && typeof g.events === 'function') return g.events() || NONE;
    const cues = (FILM.TIMELINE && FILM.TIMELINE.cues) || NONE;

  //   o.events   the event list (default FILM.game.events()); tools pass the mock here, the film never does
  //   o.samples  length (default the film's duration)
  //   o.foley    false to leave out the TV (FILM.foley)

  //   o.log      true: attach out.log = [[frame, [addr, value, ...]], ...], every register write
  function synth(sr, opts) {
    if (!defined) throw new Error('retro film has no score: src/music.js must call FILM.chip.define');
    const o = opts || {};
    const events = o.events || gameEvents();
    const byF = new Map();
    for (const e of events) {
      const f = Math.max(0, Math.round(Number(e.f) || 0));
      if (!byF.has(f)) byF.set(f, []);
      byF.get(f).push(e);
    }
    const driver = makeDriver(o.mute);
    const log = o.log ? [] : null;
    const eng = makeEngine(sr, (f) => {
      const w = driver.frame(f, byF.get(f) || NONE);
      if (log && w.length) log.push([f, w]);
      return w;
    });
    const n = o.samples != null ? o.samples : Math.round((filmFrames() / FPS) * sr);
    const out = new Float32Array(n);
    for (let j = 0; j < n; j++) out[j] = eng.out(j) * GAIN;
    if (o.foley !== false && FILM.foley && typeof FILM.foley.apply === 'function') FILM.foley.apply(out, sr);
    if (log) out.log = log;
    return out;
  }

  FILM.audio = {
    render(ctx, opts) {
      const o = opts || {};
      const start = Math.max(0, Number(o.start) || 0);
      const dest = o.dest || ctx.destination;
      const base = ctx.currentTime;
      const sr = ctx.sampleRate;
      // o.events: tools only (a mock list while the game is built); the film always hears its game
      const data = o.events ? synth(sr, { events: o.events }) : cache[sr] || (cache[sr] = synth(sr));
      if (start >= data.length / sr) return;
      const buf = ctx.createBuffer(2, data.length, sr);
      buf.getChannelData(0).set(data);
      buf.getChannelData(1).set(data);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(dest);
      // A live context keeps running while the chip is emulated: start late by that much, on time.
      const late = Math.max(0, ctx.currentTime - base);
      src.start(base + late, start + late);
    },
    // The playable mode: the same driver and chip, generated as it plays. Feed it what the game engine's
    // step() returns each frame; they sound on the next driver frame.
    live(actx, opts) {
      const o = opts || {};
      const queue = [];
      const driver = makeDriver();
      const eng = makeEngine(actx.sampleRate, (f) => driver.frame(f, queue.splice(0, queue.length)));
      let vol = o.volume == null ? 1 : Number(o.volume);
      let j = 0;
      const node = actx.createScriptProcessor(o.bufferSize || 1024, 1, 1);
      node.onaudioprocess = (e) => {
        const out = e.outputBuffer.getChannelData(0);
        for (let i = 0; i < out.length; i++) out[i] = eng.out(j++) * GAIN * vol;
      };
      node.connect(o.dest || actx.destination);
      if (o.song) queue.push({ type: 'song', id: o.song });
      return {
        node,
        song(id) {
          queue.push({ type: 'song', id });
        },
        event(ev) {
          if (ev) queue.push(ev);
        },
        events(list) {
          for (const ev of list || NONE) queue.push(ev);
        },
        get frame() {
          return eng.frame();
        },
        get volume() {
          return vol;
        },
        set volume(v) {
          vol = Number(v);
        },
        stop() {
          node.onaudioprocess = null;
          node.disconnect();
        },
      };
    },
    synth,
    // tools: an effect's program for an event, { pri, frames per channel }
    effect: (ev) => {
      const make = SFX[ev.type];
      if (!make) return null;
      const pr = make(ev);
      const out = { pri: pr.pri };
      for (const ch of ['p1', 'p2', 't', 'n']) if (pr[ch]) out[ch] = pr[ch].length;
      return out;
    },
    // tools: a bare driver, frame(f, events) -> register writes, state() -> { song, sf, paused }
    driver: (mute) => makeDriver(mute),
    get songs() {
      return Object.keys(SONGS);
    },
    get sfx() {
      return Object.keys(SFX);
    },
    info: () => ({
      gain: GAIN,
      dmcRomBytes: DMC.romBytes,
      dmc: Object.fromEntries(['kick', 'snare', 'timpD', 'timpC'].map((k) => [k, DMC[k].bytes])),
      songs: Object.fromEntries(Object.keys(SONGS).map((k) => [k, { speed: SONGS[k].speed, rows: SONGS[k].rows, frames: SONGS[k].L, loopFrame: SONGS[k].LF, sections: Object.assign({}, SONGS[k].sections) }])),
    }),
  };
})();

<script>
// ---- src/crt.js
/*
 * crt.js : the TV. Owner: crt. Presents the console's 320x180 native frame buffer on a simulated
 * 1980s consumer CRT at any output size (1920x1080, 3840x2160 with render --scale 2, or the
 * player's own device size). See docs/display.md for the whole design and the numbers.
 *
 *   FILM.crt.present(srcCanvas, outCtx, f)  fill outCtx.canvas with the TV image at global frame f
 *                      (f may also be { frame, T, overlays })
 *   FILM.crt.buttonsAt null (default: no input display) or f => button mask at frame f (null = no pad
 *                      that frame); a game overlay sets it
 *   FILM.TIMELINE.retro.crt  { caption: string|'' (lines split on \n), powerOn: [f0,f1]|null,
 *                      powerOff: [f0,f1]|null }: the film's power windows and closing caption
 *   FILM.crt.mode      'crt' (default) | 'clean' (whole-pixel nearest-neighbour, FILM.presentNearest)
 *   FILM.crt.backend   'webgl2' | 'webgl' | 'cpu' | 'nearest' (null until the first present)
 *   FILM.crt.force     set before the first present to test a fallback: 'webgl' | 'cpu' | 'nearest'
 *   FILM.crt.power(f)  the pure power state at global frame f (what the TV is doing)
 *   FILM.crt.marks()   the power sequence's key frames (click, line, open, lock, squeeze, dot ...),
 *                      for the TV foley to land on
 *   FILM.crt.params    tunables (see DEFAULTS); change them before a render, never per frame
 *   FILM.crt.camera(f) the pure camera at global frame f: { t, zoom, cx, cy } (t 1 = the tube fills the
 *                      frame, 0 = the wide shot of the set in its dark room)
 *   FILM.crt.overlays  { input: true, caption: true }: the baked proof layers, drawn crisp after the TV:
 *                      the controller input display (FILM.crt.buttonsAt(f)) where it returns a mask, and the
 *                      closing caption on the dark glass after the power-off
 *   FILM.crt.inputWindows() / captionWindow()  the frames those layers show
 *   FILM.crt.settledFrame()  a frame with the TV on and the tube filling the frame (live play presents
 *                      with it, and { overlays: false }: the input display shows the film's tape)
 *   present(..., { frame, overlays: false })  one present without the proof layers
 *   FILM.crt.recover   false (default: the film's behaviour, a lost GL context falls back to 'cpu' for
 *                      the session). The game page sets true: a lost context presents clean
 *                      (FILM.presentNearest) while FILM.crt.lost is true, and webglcontextrestored
 *                      rebuilds GL through crt.reset(), so the CRT comes back
 *   FILM.crt.glContext()  the live GL context or null (tools lose and restore it through WEBGL_lose_context)
 *
 * The pipeline (webgl2, and the same shaders under webgl):
 *   1 index    every native pixel is an NES colour; it is mapped back to its palette index $00-$3F
 *   2 decode   the NES PPU composite signal of each index (12-phase square-wave chroma, the per-level
 *              voltages, 8 samples a pixel, the 4-sample phase shift each scanline) decoded by a TV:
 *              a luma low-pass with a sharpness peak and I/Q demodulation through a chroma low-pass.
 *              The whole linear chain is folded into a lookup table per (index, phase, offset), so the
 *              shader sums nine neighbouring pixels. Flat areas decode to exactly the lib.NES colour;
 *              edges get the real signal's colour bleed and cross-colour fringes. The frame phase is
 *              fixed (no 60 Hz dot crawl to turn to mush under video compression).
 *   3 glow     a linear-light downsample blurred twice (glow, ~1.3 native px, and halo, ~10 px)
 *   4 tube     a camera: the power-on starts on the whole set (a procedural 1980s TV: woodgrain cabinet,
 *              moulded bezel, knobs, a pilot light, on a sideboard in a dark room lit only by the screen,
 *              whose light follows the picture's average colour) and pushes in until the tube fills the
 *              frame; the power-off pulls back out so the dot dies in the set. Then, on the tube,
 *              one native row = one scanline: a gaussian beam per colour channel whose width grows
 *              with brightness (box-filtered analytically, so it anti-aliases at any output size), a
 *              gentle aperture grille, halation, barrel curvature with rounded dark corners, vignette,
 *              the glass (a faint room reflection and the lit black level), and the power sequences:
 *              snow, vertical roll, degauss wobble, the line opening and the collapse to a dot.

  const SH = 180; // native height (FILM.NATIVE_H): one row = one scanline
  const DEC_PER_PX = 4; // decoded samples kept per native pixel (every second composite sample)

  const DEFAULTS = {
    gammaIn: 2.4, // the tube's gamma
    gammaOut: 2.2, // the viewer's display
    sigmaMin: 0.15, // beam sigma of a dark line, in scanline pitches (thin line, deep gap)
    sigmaMax: 0.4, // beam sigma of a full-brightness line (fills the gap: bright rows bloom)
    maskK: 0.2, // aperture grille strength (0 none, 1 pure stripes)
    maskW: 0, // grille stripe width in output px; 0 = auto, one stripe per 1080 lines of output
    brightness: 1.06,
    glow: 0.07, // share of the picture replaced by its 1.3 px glow (softens, fills gaps)
    halo: 0.045, // wide halation added on top
    curv: [0.028, 0.042], // barrel curvature (x bends with y^2, y with x^2)
    fit: [1.014, 1.022], // >1 shrinks the picture inside the glass (a thin dark border, nothing cropped)
    vignette: 0.2,
    refl: 1, // glass reflection strength
    conv: 0.18, // red/blue misconvergence at the screen edges, native px
    sharp: 0.3, // TV sharpness control: luma peaking
    lumaSigma: 2.3, // the band-limited (clean) share of luma: gaussian sigma in composite samples (8 = 1 px)
    chroma: 36, // chroma low-pass length in composite samples (12 = one subcarrier cycle)

    phase: 0, // frame phase of the composite signal (0, 4 or 8); fixed, so artifacts do not crawl

  crt.overlays = Object.assign({ input: true, caption: true }, crt.overlays || {});

  // the closing caption comes from FILM.TIMELINE.retro.crt.caption, read at present time

  const OFF_LEN = 120;

      stage: 'on', lit: true, scaleX: 1, scaleY: 1, gain: 1, lift: 0, snow: 0, sat: 1, sig: 1,
      roll: 0, jit: 0, deg: 0, degPhase: 0, wobble: 0,

    };

      st.stage = 'powerOn';

      st.line = lineIn * 2.4 * (1 - smooth(ON.open, ON.open + 7, u));

  function presentCPU(idx, out, f, st) {
    const p = crt.params;
    const W = out.canvas.width;
    const H = out.canvas.height;
    if (!cpu) {
      const dec = FILM.makeCanvas(DW, SH);
      cpu = { dec, dctx: dec.getContext('2d'), img: null, lines: null, linesH: 0 };
      cpu.img = cpu.dctx.createImageData(DW, SH);
    }
    const Lt = buildLut().data;
    out.save();
    out.setTransform(1, 0, 0, 1, 0, 0);
    out.globalAlpha = 1;
    out.globalCompositeOperation = 'source-over';
    out.fillStyle = '#070808';
    out.fillRect(0, 0, W, H);
    if (st.lit) {
      const d = cpu.img.data;
      for (let y = 0; y < SH; y++) {
        const P = (4 * y + (p.phase | 0)) % 12;
        for (let X = 0; X < DW; X++) {
          const m = X >> 2, u = X & 3;
          let Y = 0, I = 0, Q = 0;
          for (let oi = 0; oi <= 2 * NB; oi++) {
            const k = m + oi - NB;
            const id = k >= 0 && k < SW ? idx[y * SW + k] : 15;
            const a = (((8 * k + P) % 12) + 12) % 12 >> 2;
            const o = ((id * 3 + a) * LUT_W + oi * 4 + u) * 4;
            Y += Lt[o];
            I += Lt[o + 1];
            Q += Lt[o + 2];
          }
          const i4 = (y * DW + X) * 4;
          // x1.22: the scanline overlay below darkens the average by about 18%
          const g = (v) => 255 * Math.pow(clamp01(v), p.gammaIn / p.gammaOut) * Math.min(1.5, 1.22 * p.brightness * st.gain * st.sig);
          d[i4] = g(Y + 0.9563 * I + 0.621 * Q);
          d[i4 + 1] = g(Y - 0.2721 * I - 0.6474 * Q);
          d[i4 + 2] = g(Y - 1.107 * I + 1.7046 * Q);
          d[i4 + 3] = 255;
        }
      }
      cpu.dctx.putImageData(cpu.img, 0, 0);
      const pw = (W / p.fit[0]) * st.scaleX;
      const ph = (H / p.fit[1]) * st.scaleY;
      out.imageSmoothingEnabled = true;
      out.imageSmoothingQuality = 'high';
      out.drawImage(cpu.dec, (W - pw) / 2, (H - ph) / 2, pw, ph);
      // scanline gaps
      if (!cpu.lines || cpu.linesH !== H) {
        const pitch = H / SH;
        const c = FILM.makeCanvas(1, Math.max(2, Math.round(pitch * 2)));
        const g2 = c.getContext('2d');
        for (let y = 0; y < c.height; y++) {
          const t = ((y + 0.5) / pitch) % 1;
          const a = 0.55 * Math.pow(Math.abs(t - 0.5) * 2, 2);
          g2.fillStyle = `rgba(0,0,0,${a.toFixed(3)})`;
          g2.fillRect(0, y, 1, 1);
        }
        cpu.lines = c;
        cpu.linesH = H;
      }
      out.fillStyle = out.createPattern(cpu.lines, 'repeat');
      out.fillRect((W - pw) / 2, (H - ph) / 2, pw, ph);
    }
    if (st.line > 0) {
      const cx = W / 2, cy = H / 2;
      const half = (st.lineHalf * H) / 2;
      const r = Math.max(2, st.lineSig * H * 3);
      out.globalCompositeOperation = 'lighter';
      const c = st.lineCol;
      out.fillStyle = `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${Math.min(1, st.line / 2).toFixed(3)})`;
      out.beginPath();
      out.ellipse(cx, cy, half + r, r, 0, 0, Math.PI * 2);
      out.fill();
    }
    // vignette and rounded corners
    out.globalCompositeOperation = 'source-over';
    const vg = out.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.55);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    out.fillStyle = vg;
    out.fillRect(0, 0, W, H);
    out.restore();
  }

  // ---------------------------------------------------------------------------
  // present
  // ---------------------------------------------------------------------------
  function ensureBackend() {
    if (crt.backend) return crt.backend;
    const order = { webgl2: ['webgl2', 'webgl', 'cpu', 'nearest'], webgl: ['webgl', 'cpu', 'nearest'], cpu: ['cpu', 'nearest'], nearest: ['nearest'] }[crt.force] || ['webgl2', 'webgl', 'cpu', 'nearest'];
    for (const k of order) {
      if (k === 'webgl2' || k === 'webgl') {
        try {
          G = initGL(k);
        } catch (e) {
          G = null;
          FILM.errors && FILM.errors.push({ T: null, message: String((e && e.message) || e) });
        }
        if (G) return (crt.backend = k);
      } else if (k === 'cpu') {
        if (FILM.makeCanvas) {
          crt.renderer = 'canvas 2d';
          return (crt.backend = 'cpu');
        }
      } else {
        crt.renderer = 'canvas 2d';
        return (crt.backend = 'nearest');
      }
    }
    return (crt.backend = 'nearest');
  }

  crt.present = function present(src, outCtx, o) {
    o = typeof o === 'number' ? { frame: o } : o || {};
    const f = o.frame != null ? Math.floor(o.frame) : Math.floor((Number(o.T) || 0) * 60 + 1e-6);
    if (crt.mode === 'clean') {
      FILM.presentNearest(src, outCtx);
      return;
    }
    const be = ensureBackend();
    if (be === 'nearest') {
      FILM.presentNearest(src, outCtx);
      if (o.overlays !== false) drawOverlays(outCtx, f, { zoom: 1, cx: 0, cy: 0 });
      return;
    }
    const idx = indices(src);
    const st = crt.power(f);
    const cam = crt.camera(f);
    if (be === 'webgl2' || be === 'webgl') {
      if (G.gl.isContextLost && G.gl.isContextLost()) {
        if (crt.recover) {
          // clean until webglcontextrestored rebuilds GL (watchLoss)
          crt.lost = true;
          FILM.presentNearest(src, outCtx);
          return;
        }
        G = null;
        crt.backend = null;
        crt.force = 'cpu';
        return present(src, outCtx, o);
      }
      presentGL(idx, outCtx, f, st, cam);
    } else {
      presentCPU(idx, outCtx, f, st);
    }
    if (o.overlays !== false) drawOverlays(outCtx, f, be === 'cpu' ? { zoom: 1, cx: 0, cy: 0 } : cam);
  };

  /** The live GL context, or null (tools lose and restore it through its WEBGL_lose_context extension). */
  crt.glContext = function glContext() {
    return G && G.gl ? G.gl : null;
  };

  /** Drop the GL state (tools call this to test a cold start or another backend). */
  crt.reset = function reset() {
    if (G && G.gl) {
      const ext = G.gl.getExtension('WEBGL_lose_context');
      if (ext) ext.loseContext();
    }
    G = null;
    cpu = null;
    crt.backend = null;
  };
})();

<script>
// ---- src/props.js
/*
 * props.js : the shared doodle props and primitives for photo-doodle films, drawn once here so
 * every shot draws them identically. Loaded after lib.js and before the scenes.
 *
 * Everything is a pure function of its arguments (no state between frames) and every stroke goes
 * through FILM.lib.inkPath, so the boil and the draw-on behave like the rest of the film.
 *
 *   props:       bubble, sparkle, speedLines, starburst, cloud, sun, moon, heart, note, flag,
 *                trail, zzz, dust, drop (see each function's comment)
 *   primitives:  step (stroke i of n from a figure's draw fraction), place (translate/scale/flip),
 *                ink, wash, eye, blush, blob — what src/cast.js builds its characters from
 *
 * The film's own characters live in src/cast.js and call these. Keep them out of scene files: a
 * character redrawn per scene drifts, and sixteen agents will each drift differently.
 *
 * Draw-on: every function takes draw 0..1 and reveals its strokes in order, each stroke taking
 * 1/n of the range with a small overlap, so a figure assembles the way a hand would draw it.
 * Night shots pass night: true, which swaps ink for chalk and drops the pigment.
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);

  /** progress of stroke i of n, given the whole-figure draw fraction */
  const step = (d, i, n) => clamp((d * n - i) * 1.35);

  /** rotate + scale helper: maps local coords (x right, y down, origin at the figure's base) */
  function place(ctx, o, fn) {
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.tilt) ctx.rotate(o.tilt);
    const s = o.s != null ? o.s : 1;
    ctx.scale(o.flip ? -s : s, s);
    fn();
    ctx.restore();
  }

  const inkOf = (o) => (o.night ? P.chalk : P.doodleInk);

  function ink(ctx, pts, o, extra) {
    // o.alpha applies to the whole figure; extra.alpha (per stroke) multiplies it.
    const base = { color: inkOf(o), width: 3.4, wobble: 1.6, tremble: 0.4 };
    const q = Object.assign(base, extra);
    if (o.alpha != null) q.alpha = (q.alpha != null ? q.alpha : 1) * o.alpha;
    L.inkPath(ctx, pts, q);
  }

  function wash(ctx, pts, o, color, extra) {
    if (o.night) return; // night shots are chalk line only, no pigment
    L.wash(ctx, pts, Object.assign({ color, alpha: 0.5, seed: (extra && extra.seed) || 7 }, extra));
  }

  /** a closed blob path: centre, radius, per-angle radius function */
  function blob(cx, cy, n, rf) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const r = rf(a, i);
      pts.push([cx + Math.cos(a) * r[0], cy + Math.sin(a) * r[1]]);
    }
    return pts;
  }

  const eye = (ctx, x, y, r, o, blink) => {
    if (blink > 0.5) ink(ctx, [[x - r * 1.3, y], [x + r * 1.3, y]], o, { width: 2.6, smooth: false, taper: 3 });
    else {
      ctx.save();
      ctx.fillStyle = inkOf(o);
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 1.08, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  };

  const blush = (ctx, x, y, r, o) => {
    if (o.night) return;
    ctx.save();
    ctx.globalAlpha *= 0.55;
    ctx.fillStyle = P.blush;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.68, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  };

  // ---------------------------------------------------------------------------
  // Props
  // ---------------------------------------------------------------------------

  /** bubble(ctx, o) : speech bubble with a tail. x, y is the bubble centre; tail points at tx, ty. */
  function bubble(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const w = o.w || 200, h = o.h || 110;
    const pts = blob(o.x, o.y, 34, (a) => [w / 2 + Math.cos(a * 3) * 5, h / 2 + Math.sin(a * 2) * 4]);
    if (!o.night) {
      L.wash(ctx, pts, { color: o.fill || P.washCream, alpha: o.fillAlpha != null ? o.fillAlpha : 0.75, p: d, seed: (o.seed || 5) + 1, offset: [2, 2], edge: 0 });
    }
    ink(ctx, pts, o, { closed: true, draw: d, width: 3, seed: o.seed || 5 });
    if (o.tx != null) {
      const dx = o.tx - o.x, dy = o.ty - o.y;
      const l = Math.hypot(dx, dy) || 1;
      const bx = o.x + (dx / l) * (w / 2) * 0.8, by = o.y + (dy / l) * (h / 2) * 0.9;
      ink(ctx, [[bx - 14, by - 2], [o.tx, o.ty], [bx + 12, by + 8]], o, { draw: d, width: 2.8, seed: (o.seed || 5) + 2 });
    }
    if (o.label && d > 0.85) {
      L.hand(ctx, o.label, o.x, o.y + (o.size || 42) * 0.34, {
        size: o.size || 42,
        align: 'center',
        color: inkOf(o),
        p: clamp((d - 0.85) / 0.15),
      });
    }
  }

  /** sparkle(ctx, x, y, r, o) : a four-point twinkle. */
  function sparkle(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0) return;
    const k = r * d;
    ink(ctx, [[x - k, y], [x + k, y]], o, { width: o.width || 2.4, seed: (o.seed || 3) });
    ink(ctx, [[x, y - k], [x, y + k]], o, { width: o.width || 2.4, seed: (o.seed || 3) + 1 });
    ink(ctx, [[x - k * 0.45, y - k * 0.45], [x + k * 0.45, y + k * 0.45]], o, { width: (o.width || 2.4) * 0.7, seed: (o.seed || 3) + 2 });
    ink(ctx, [[x + k * 0.45, y - k * 0.45], [x - k * 0.45, y + k * 0.45]], o, { width: (o.width || 2.4) * 0.7, seed: (o.seed || 3) + 3 });
  }

  /** speedLines(ctx, o) : n trailing lines behind something moving. x, y is the trailing edge. */
  function speedLines(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const n = o.n || 3, len = o.len || 90, gap = o.gap || 22, dir = o.dir != null ? o.dir : -1;
    for (let i = 0; i < n; i++) {
      const y = o.y + (i - (n - 1) / 2) * gap;
      const l = len * (i === Math.floor(n / 2) ? 1 : 0.7);
      ink(ctx, [[o.x, y], [o.x + dir * l, y + (i - (n - 1) / 2) * 4]], o, {
        draw: clamp(d * 1.4 - i * 0.12),
        width: o.width || 3,
        seed: (o.seed || 40) + i,
        smooth: false,
      });
    }
  }

  /** starburst(ctx, x, y, r, o) : the impact star behind a loud moment. */
  function starburst(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0) return;
    const n = o.n || 10;
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * TAU - Math.PI / 2;
      const rr = (i % 2 ? r * 0.52 : r) * (0.9 + 0.2 * Math.sin(i * 2.7 + (o.seed || 1)));
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    if (!o.night && o.fill !== false) L.wash(ctx, pts, { color: o.fill || P.washYellow, alpha: 0.45, p: d, seed: (o.seed || 9) + 4, offset: [3, 2] });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 3.4, seed: o.seed || 9 });
  }

  /** cloud(ctx, x, y, w, o) : a bumpy cloud. o.face: 'angry' | 'happy' draws a face on it. */
  function cloud(ctx, x, y, w, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const h = o.h || w * 0.46;
    const pts = [];
    const bumps = o.bumps || 5;
    for (let i = 0; i <= 44; i++) {
      const u = i / 44, a = u * TAU;
      const r = 1 + 0.16 * Math.cos(a * bumps + (o.seed || 2));
      pts.push([x + Math.cos(a) * (w / 2) * r, y + Math.sin(a) * (h / 2) * (a > Math.PI ? r : r * 0.82)]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washBlue, alpha: o.fillAlpha != null ? o.fillAlpha : 0.35, p: d, seed: (o.seed || 2) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 3.2, seed: o.seed || 2 });
    if (o.face && d > 0.9) {
      const ey = y - h * 0.05;
      eye(ctx, x - w * 0.12, ey, 4.6, o, o.blink || 0);
      eye(ctx, x + w * 0.12, ey, 4.6, o, o.blink || 0);
      const m = o.face === 'angry'
        ? [[x - w * 0.1, y + h * 0.2], [x, y + h * 0.12], [x + w * 0.1, y + h * 0.2]]
        : [[x - w * 0.1, y + h * 0.12], [x, y + h * 0.24], [x + w * 0.1, y + h * 0.12]];
      ink(ctx, m, o, { width: 2.4, seed: (o.seed || 2) + 6 });
      if (o.face === 'angry') {
        ink(ctx, [[x - w * 0.2, ey - 16], [x - w * 0.06, ey - 8]], o, { width: 2.4, seed: (o.seed || 2) + 7 });
        ink(ctx, [[x + w * 0.2, ey - 16], [x + w * 0.06, ey - 8]], o, { width: 2.4, seed: (o.seed || 2) + 8 });
      }
    }
  }

  /** sun(ctx, x, y, r, o) / moon(ctx, x, y, r, o) : with rays / with a sleepy face. */
  function sun(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const disc = blob(x, y, 30, () => [r, r]);
    if (!o.night) L.wash(ctx, disc, { color: o.fill || P.washYellow, alpha: 0.5, p: d, seed: (o.seed || 11) + 1 });
    ink(ctx, disc, o, { closed: true, draw: d, width: 3.2, seed: o.seed || 11 });
    const n = o.rays == null ? 8 : o.rays;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + (o.rot || 0);
      ink(ctx, [[x + Math.cos(a) * r * 1.25, y + Math.sin(a) * r * 1.25], [x + Math.cos(a) * r * 1.6, y + Math.sin(a) * r * 1.6]], o, {
        draw: clamp(d * 1.3 - i * 0.05),
        width: 2.6,
        seed: (o.seed || 11) + 3 + i,
        smooth: false,
      });
    }
    if (o.face && d > 0.9) {
      eye(ctx, x - r * 0.3, y - r * 0.1, 4.4, o, o.blink || (o.face === 'sleep' ? 1 : 0));
      eye(ctx, x + r * 0.3, y - r * 0.1, 4.4, o, o.blink || (o.face === 'sleep' ? 1 : 0));
      ink(ctx, [[x - r * 0.18, y + r * 0.26], [x, y + r * 0.38], [x + r * 0.18, y + r * 0.26]], o, { width: 2.4, seed: (o.seed || 11) + 20 });
    }
  }

  function moon(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const a = -Math.PI * 0.62 + (i / 40) * Math.PI * 1.24;
      pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
    }
    for (let i = 40; i >= 0; i--) {
      const a = -Math.PI * 0.62 + (i / 40) * Math.PI * 1.24;
      pts.push([x + Math.cos(a) * r * 0.42 + r * 0.42, y + Math.sin(a) * r * 0.92]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washCream, alpha: 0.5, p: d, seed: (o.seed || 13) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: 3.2, seed: o.seed || 13 });
    if (o.face && d > 0.9) {
      eye(ctx, x - r * 0.28, y - r * 0.08, 4.2, o, 1);
      ink(ctx, [[x - r * 0.34, y + r * 0.3], [x - r * 0.18, y + r * 0.4], [x - r * 0.02, y + r * 0.3]], o, { width: 2.2, seed: (o.seed || 13) + 6 });
    }
  }

  /** heart(ctx, x, y, r, o) and note(ctx, x, y, s, o) : the two little feeling glyphs. */
  function heart(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 48; i++) {
      const a = (i / 48) * TAU;
      const sx = 16 * Math.pow(Math.sin(a), 3);
      const sy = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      pts.push([x + (sx / 16) * r, y - (sy / 16) * r]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washPink, alpha: 0.55, p: d, seed: (o.seed || 17) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 2.8, seed: o.seed || 17 });
  }

  function note(ctx, x, y, s = 1, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const head = blob(x, y, 20, () => [11 * s, 8.5 * s]);
    if (!o.night) L.wash(ctx, head, { color: o.fill || P.washLilac, alpha: 0.55, p: d, seed: (o.seed || 19) + 1 });
    ink(ctx, head, o, { closed: true, draw: d, width: 2.6, seed: o.seed || 19 });
    ink(ctx, [[x + 10 * s, y - 2 * s], [x + 11 * s, y - 40 * s]], o, { draw: d, width: 2.6, seed: (o.seed || 19) + 2 });
    if (o.flag !== false) ink(ctx, [[x + 11 * s, y - 40 * s], [x + 26 * s, y - 30 * s], [x + 22 * s, y - 18 * s]], o, { draw: d, width: 2.4, seed: (o.seed || 19) + 3 });
  }

  /** flag(ctx, x, y, o) : a little pennant on a pole, y is the pole's foot. */
  function flag(ctx, x, y, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const h = o.h || 90;
    ink(ctx, [[x, y], [x - 2, y - h]], o, { draw: step(d, 0, 2), width: 3, seed: o.seed || 23 });
    const w = o.w || 62, wave = o.wave || 0;
    const pts = [
      [x - 2, y - h], [x + w * 0.5, y - h + 6 + wave], [x + w, y - h + 2 - wave],
      [x + w * 0.6, y - h + 30 + wave], [x - 2, y - h + 34],
    ];
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washRed, alpha: 0.5, p: step(d, 1, 2), seed: (o.seed || 23) + 1 });
    ink(ctx, pts, o, { closed: true, draw: step(d, 1, 2), width: 2.8, seed: (o.seed || 23) + 2 });
  }

  /** trail(ctx, pts, o) : a travelling character's trail — a double line with sparkles along it. */
  function trail(ctx, pts, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0 || !pts || pts.length < 2) return;
    ink(ctx, pts, o, { draw: d, width: o.width || 2.6, seed: o.seed || 29, alpha: o.alpha != null ? o.alpha : 0.75 });
    const off = pts.map(([x, y]) => [x, y + (o.gap || 9)]);
    ink(ctx, off, o, { draw: clamp(d * 1.1 - 0.08), width: (o.width || 2.6) * 0.8, seed: (o.seed || 29) + 1, alpha: (o.alpha != null ? o.alpha : 0.75) * 0.8 });
    const n = o.sparkles == null ? 3 : o.sparkles;
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n;
      if (d < u) continue;
      const k = Math.min(pts.length - 1, Math.floor(u * (pts.length - 1)));
      sparkle(ctx, pts[k][0], pts[k][1] - 14, 9, { seed: (o.seed || 29) + 5 + i, night: o.night, width: 1.8 });
    }
  }

  /** zzz(ctx, o) : three sleeping z's rising. */
  function zzz(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const s = o.s || 1;
    for (let i = 0; i < 3; i++) {
      const p = clamp(d * 3 - i);
      if (p <= 0) continue;
      const k = (26 - i * 6) * s;
      const x = o.x + i * 26 * s, y = o.y - i * 34 * s;
      ink(ctx, [[x, y], [x + k, y], [x, y + k], [x + k, y + k]], o, { draw: p, width: 2.6, smooth: false, seed: (o.seed || 31) + i });
    }
  }

  /** dust(ctx, x, y, o) : a puff of motion dust at the ground. */
  function dust(ctx, x, y, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const n = o.n || 3;
    for (let i = 0; i < n; i++) {
      const a = Math.PI + (i / (n - 1 || 1)) * Math.PI;
      const r = (o.r || 18) * (0.7 + 0.3 * Math.cos(i * 2.1));
      cloud(ctx, x + Math.cos(a) * (o.spread || 34), y + Math.sin(a) * 10, r * 2, {
        draw: clamp(d * 1.3 - i * 0.1),
        night: o.night,
        seed: (o.seed || 37) + i,
        fill: o.fill || P.washCream,
        fillAlpha: 0.3,
        width: 2.4,
      });
    }
  }

  /** drop(ctx, x, y, r, o) : a raindrop / teardrop, point up. */
  function drop(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 30; i++) {
      const a = (i / 30) * TAU - Math.PI / 2;
      const rr = r * (1 - 0.45 * Math.cos(a)) * (a > Math.PI * 0.5 && a < Math.PI * 1.5 ? 1 : 1);
      pts.push([x + Math.cos(a) * rr * 0.72, y + Math.sin(a) * rr]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washBlue, alpha: 0.5, p: d, seed: (o.seed || 41) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 2.4, seed: o.seed || 41 });
  }

  FILM.props = {
    bubble,
    sparkle,
    speedLines,
    starburst,
    cloud,
    sun,
    moon,
    heart,
    note,
    flag,
    trail,
    zzz,
    dust,
    drop,
    // primitives, for src/cast.js
    step,
    place,
    ink,
    wash,
    eye,
    blush,
    blob,
    inkOf,
  };
})();

// Shot 'dopa' of "Mente y corazon enamorados" (retro, native 180x320). f = shot-local frame, F = global frame.
(function () {
  'use strict';
  const R = FILM.retro, P = R.RETRO_PAL, A = FILM.amor, nes = FILM.nes;
  function paint(g, f, F) {
    A.bg(g, P.ink);
    A.stars(g, F, 3, P.night);
    const cx = 90, cy = 162;
    // rays from the reward centre
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + f * 0.01;
      for (let r = 20; r < 96; r += 6) {
        if ((r + f * 2 + i * 5) % 24 < 6) R.px(g, Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r * 0.9), 2, 2, P.wine);
      }
    }
    R.sprite(g, 'brain', 30, 110, { scale: 3 });
    // the circuit: a gold path from the deep centre (VTA) forward (nucleus accumbens) and to the front
    const path = [[96, 176], [88, 168], [80, 160], [70, 150], [58, 142]];
    const lit = Math.min(path.length, 1 + Math.floor(f / 10));
    for (let i = 0; i < lit - 1; i++) {
      const [x0, y0] = path[i], [x1, y1] = path[i + 1];
      for (let s = 0; s <= 8; s++) R.px(g, Math.round(x0 + (x1 - x0) * s / 8) - 1, Math.round(y0 + (y1 - y0) * s / 8) - 1, 3, 3, P.gold);
    }
    const pr = 5 + (A.beat(F, 36, 0) ? 3 : 0);
    A.disc(g, 96, 176, pr, P.gold);
    A.disc(g, 96, 176, pr - 3, P.amber);
    // dopamine sparks spill out
    for (let i = 0; i < 18; i++) {
      const a = A.hash(i * 7 + 3) * Math.PI * 2;
      const r = ((f * 1.3 + i * 11) % 90);
      if (f * 1.3 < r) continue;
      R.sprite(g, 'spark', Math.round(96 + Math.cos(a) * r) - 2, Math.round(176 + Math.sin(a) * r * 0.85) - 2);
    }
    A.say(g, [{ s: 'DOPAMINA', scale: 2, color: P.gold }], 34);
    if (f >= 12) A.say(g, [{ s: 'SE ENCIENDE TU', color: P.petal }, { s: 'CIRCUITO DE', color: P.petal }, { s: 'RECOMPENSA', color: P.petal }], 58);
    if (f >= 48) A.say(g, [{ s: 'EL MISMO QUE', color: P.hudWhite }, { s: 'ACTIVA UNA ADICCION', color: P.hudWhite }], 226);
  }
  FILM.scene({
    id: 'dopa',
    draw(ctx, t, info) {

      const nb = FILM.native();
      paint(nb.ctx, Math.min(nes.frameOf(tt), 143), info.frame);

(function () {
  'use strict';
  const R = FILM.retro, P = R.RETRO_PAL, A = FILM.amor, nes = FILM.nes;
  function paint(g, f, F) {
    A.bg(g, P.ink);
    // beats: every 36 frames, then double time from frame 72
    const beats = [0, 36, 72, 90, 108, 126];
    let since = 999;
    for (const b of beats) if (f >= b) since = f - b;
    const big = since < 6 || (since >= 10 && since < 14);
    const bpm = f < 36 ? 72 : f < 72 ? 96 : Math.min(130, 112 + ((f - 72) >> 2));
    if (big) { A.ring(g, 90, 150, 62, P.wine); A.ring(g, 90, 150, 66, P.wine); }
    A.heartAt(g, 90, 150, big, 3);
    // speed lines when racing
    if (f >= 72) for (let i = 0; i < 6; i++) { const y = 100 + i * 20; const x = (F * 4 + i * 37) % 40; R.px(g, 4 + x % 12, y, 8, 1, P.blush); R.px(g, 168 - x % 12, y + 10, 8, 1, P.blush); }
    A.say(g, [{ s: 'ADRENALINA', scale: 2 }], 34);
    if (f >= 12) A.say(g, [{ s: 'EL PULSO SE DISPARA', color: P.petal }], 58);

    R.px(g, 8, 226, 164, 30, P.night);
    A.ecg(g, 8, 241, 164, Math.floor(f + (f * f) / 140), 40, P.mint, 11);
  }
  FILM.scene({
    id: 'pulse',
    draw(ctx, t, info) {
      const tt = Math.max(0, Math.min(t, info.dur || t));
      const nb = FILM.native();
      paint(nb.ctx, Math.min(nes.frameOf(tt), 143), info.frame);

})();

  const R = FILM.retro, P = R.RETRO_PAL, A = FILM.amor, nes = FILM.nes;
  function paint(g, f, F) {
    A.bg(g, P.night);
    A.stars(g, F, 8, P.petal);
    const lock = f >= 72;
    const shift = lock ? 0 : Math.round(17 * (1 - f / 72));
    const bigL = A.beat(f, 36, 0);
    const bigR = A.beat(f, 36, shift);
    A.heartAt(g, 48, 150, bigL, 2);
    R.sprite(g, bigR ? 'heart28' : 'heart24', 132 - 28, 150 - 26, { scale: 2 });
    R.pxtext(g, 'TU', 48, 186, { color: P.sky, shadow: P.ink, align: 'center' });
    R.pxtext(g, 'AMOR', 132, 186, { color: P.blush, shadow: P.ink, align: 'center' });
    // two traces that lock together
    R.px(g, 8, 200, 164, 40, P.ink);
    A.ecg(g, 8, 214, 164, f, 36, P.sky, 8);
    A.ecg(g, 8, lock ? 214 : 228, 164, f + shift, 36, P.blush, 8);
    if (lock) R.pxtext(g, '♥ = ♥', 90, 104 - (f < 78 ? 78 - f : 0), { scale: 2, color: P.gold, shadow: P.ink, align: 'center' });
    A.say(g, [{ s: 'SINCRONIA', scale: 2, color: P.gold }], 34);
    if (f >= 12) A.say(g, [{ s: 'SUS PULSOS Y', color: P.petal }, { s: 'RESPIRACION SE', color: P.petal }, { s: 'ACOMPASAN', color: P.petal }], 56);
  }
  FILM.scene({
    id: 'sync',
    draw(ctx, t, info) {
      const tt = Math.max(0, Math.min(t, info.dur || t));
      const nb = FILM.native();
      paint(nb.ctx, Math.min(nes.frameOf(tt), 143), info.frame);
      FILM.presentNearest(nb.canvas, ctx);
    },
  });
})();

</script>

(function () {
  'use strict';
  const R = FILM.retro, P = R.RETRO_PAL, A = FILM.amor, nes = FILM.nes;
  function paint(g, f, F) {
    A.bg(g, P.plum);
    A.stars(g, F, 9, P.blush);
    A.disc(g, 90, 170, 46, P.wine);
    A.disc(g, 90, 170, 40, P.love);
    R.px(g, 0, 249, 180, 71, P.ink);
    R.px(g, 0, 249, 180, 2, P.blush);
    const u = Math.min(f, 72);
    const yx = Math.round(-4 + u * (60 - -4) / 72);
    const ax = Math.round(152 - u * (152 - 89) / 72);
    A.person(g, 'yo', yx, 203, F, f < 72, false, 2);
    A.person(g, 'amor', ax, 203, F, f < 72, true, 2);
    if (f >= 72) {
      // the hug: arms across, and oxytocin hearts rising
      R.px(g, 82, 228, 16, 3, P.skin);
      const k = f - 72;
      R.pxtext(g, '♥', 82, 182 - Math.min(k, 8), { scale: 2, color: P.blush, shadow: P.ink });
      for (let i = 0; i < 7; i++) {
        const r = (k * 1.5 + i * 14) % 90;
        const x = 90 + Math.round(Math.sin(i * 2.1 + k * 0.08) * (14 + i * 4));
        R.pxtext(g, '♥', x - 3, Math.round(200 - r), { color: i % 2 ? P.petal : P.blush });
      }
    }
    A.say(g, [{ s: 'OXITOCINA', scale: 2, color: P.petal }], 34);
    if (f >= 12) A.say(g, [{ s: 'LA HORMONA DEL APEGO', color: P.hudWhite }, { s: 'Y LA CONFIANZA', color: P.hudWhite }], 58);
  }
  FILM.scene({
    id: 'oxy',
    draw(ctx, t, info) {
      const tt = Math.max(0, Math.min(t, info.dur || t));
      const nb = FILM.native();
      paint(nb.ctx, Math.min(nes.frameOf(tt), 143), info.frame);
      FILM.presentNearest(nb.canvas, ctx);

  });
})();

// Shot 'end' of "Mente y corazon enamorados" (retro, native 180x320). f = shot-local frame, F = global frame.
(function () {
  'use strict';
  const R = FILM.retro, P = R.RETRO_PAL, A = FILM.amor, nes = FILM.nes;
  function paint(g, f, F) {
    A.bg(g, P.night);
    A.stars(g, F, 10, P.petal);
    R.sprite(g, 'brain', 50, 96, { scale: 2 });
    // the wire from the brain stem down to the heart, a spark running along it
    R.px(g, 97, 154, 2, 26, P.gold);
    const s = (F * 2) % 26;
    R.px(g, 96, 154 + s, 4, 3, P.amber);
    const big = A.beat(f, 36, 0);
    A.heartAt(g, 90, 206, big, 2);
    if (f >= 36) {
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const r = 30 + ((f - 36) % 30);
        R.sprite(g, 'spark', Math.round(90 + Math.cos(a) * r) - 2, Math.round(206 + Math.sin(a) * r) - 2);
      }
    }
    A.say(g, [{ s: 'EL AMOR ES', scale: 2 }, { s: 'QUIMICA', scale: 2, color: P.gold }], 30);
    if (f >= 18) A.say(g, [{ s: 'Y TU CORAZON LO SABE', color: P.petal }], 72);
    if (f >= 36) R.pxtext(g, 'MENTE EN SEGUNDOS', 90, 248, { color: P.blush, shadow: P.ink, align: 'center' });
  }
  FILM.scene({
    id: 'end',
    draw(ctx, t, info) {

<script>
// ---- src/music.js
// src/music.js : the chip score of "Mente y corazon enamorados". Speed 9 = 100 bpm, one bar = 2.4 s.
//
// THE SONG 'amor': 8 bars of 4/4 in G major, original, looping. Chords: G | Em | C | D | G | Bm | C D | G.
// The film plays it twice through bar 8 (0 to 19.2 s), the loop carries shot 09, then 'fin' (1 bar,
// no loop) closes the film on a rising G arpeggio that rings out by 24 s.
//
// ORIGINALITY RECORD (node tools/audio/melody.cjs amor): see the decoded bars pasted below.
//   bar 1: D5:2 G5:2 B5:4 A5:2 G5:2 E5:4
//   bar 2: G5:2 E5:2 B4:4 D5:2 E5:2 G5:4
//   bar 3: E5:3 G5 C6:4 B5:2 A5:2 G5:4
//   bar 4: F#5:2 E5:2 D5:2 E5:2 F#5:8
//   Known tunes in the same role (8-bit "love theme" jingles): none shares this opening — a rising
//   fifth-plus-third pickup (D-G-B) that falls back by step to E; the rhythm is 2-2-4 / 2-2-4.
FILM.chip.define({
  songs: {
    amor: {
      speed: 9,
      sections: { a: 0 },
      p1: '@lead | D5:2 G5:2 B5:4 A5:2 G5:2 E5:4 G5:2 E5:2 B4:4 D5:2 E5:2 G5:4 ' +
        'E5:3 G5 C6:4 B5:2 A5:2 G5:4 F#5:2 E5:2 D5:2 E5:2 F#5:8 ' +
        'B5:3 A5 G5:2 B5:2 D6:4 B5:4 A5:2 F#5:2 D5:2 F#5:2 B5:8 ' +
        'C6:2 B5:2 A5:2 G5:2 A5:2 B5:2 A5:4 G5:4 D5:4 G5:8',
      p2: '@harm | B4:8 D5:8 G4:8 B4:8 E4:8 G4:8 F#4:8 A4:8 ' +
        'D5:8 B4:8 F#4:8 D5:8 E4:8 F#4:8 B4:8 B4:8',
      t: '| G2:4 D3:4 G2:4 D3:4 E2:4 B2:4 E2:4 B2:4 C3:4 G2:4 C3:4 G2:4 D3:4 A2:4 D3:4 A2:4 ' +
        'G2:4 D3:4 G2:4 D3:4 B2:4 F#2:4 B2:4 F#2:4 C3:4 G2:4 D3:4 A2:4 G2:4 D3:4 G2:8',
      n: '| [h:2 h:2 s:2 h:2]16',
    },
    fin: {
      speed: 9,
      loop: false,
      sections: { a: 0 },
      p1: '@lead G5:2 B5:2 D6:2 G6:10',
      p2: '@harm D5:2 G5:2 B5:2 D6:10',
      t: 'G2:4 D3:4 G2:8',
      n: 's:2 r:14',
    },
  },
  sfx: {
    // beat: the heartbeat, a double triangle knock (lub-dub), loud on the cue frame
    beat: (ev, K) => ({ pri: 3, t: K.cat(K.tthud(98, 7, 0.9), K.gap(5), K.tthud(82, 9, 0.9)) }),
    // alert: two quick high blips, the "!" over the hero
    alert: (ev, K) => ({ pri: 3, p2: K.cat(K.pt(K.mhz('A6'), 3, { d: 2, v: [15, 15] }), K.gap(3), K.pt(K.mhz('A6'), 6, { d: 2, v: [14, 0] })) }),
    // pop: a heart appears, a rising square sweep
    pop: (ev, K) => ({ pri: 3, p2: K.pt(K.mhz('E5'), 14, { d: 2, v: [15, 3], bend: Math.pow(2, 1 / 9) }) }),
    // sparkle: a fast shimmer of two high notes, fading
    sparkle: (ev, K) => ({ pri: 2, p2: K.trill(K.mhz('B6'), K.mhz('E7'), 30, { v: [13, 0], d: 1 }) }),
    // flutter: wings, short noise ticks
    flutter: (ev, K) => ({ pri: 2, n: K.nz([[3, 9], [3, 0], [3, 7], [3, 0], [3, 8], [3, 0], [3, 6], [3, 0], [3, 5], [3, 0], [3, 3]]) }),
    // off: the judgement switch, a falling sweep into a click
    off: (ev, K) => ({ pri: 4, p1: K.pt(K.mhz('C6'), 24, { d: 2, v: [15, 0], bend: 0.94 }), n: K.nz([[8, 12], [9, 6], [10, 2]]) }),
    // chime: the hearts lock in step, a bright two-note bell
    chime: (ev, K) => ({ pri: 3, p2: K.cat(K.pt(K.mhz('G6'), 4, { d: 1, v: [15, 15] }), K.pt(K.mhz('D7'), 20, { d: 1, v: [13, 0] })) }),
  },
});

</script>
<script>
// ---- src/player.js
/*
 * player.js : the interactive page around the film.
 *
 *   click or space   play / pause (with audio)
 *   left / right     step one frame back / forward
 *   ?t=seconds       open paused on that global time
 *   ?shot=id         loop one shot
 *   ?render=1        no UI, canvas at native size, nothing drawn until asked (used by tools)
 *
 * The clock while playing is the AudioContext clock when there is music, otherwise the
 * requestAnimationFrame timestamp. Nothing here draws: it only calls FILM.renderFrame(T).
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  if (!FILM || typeof FILM.renderFrame !== 'function') return;

  const params = new URLSearchParams(window.location.search);
  const renderMode = params.get('render') === '1';

  if (renderMode) {
    // tools mount their own canvas; keep the page inert
    document.documentElement.style.background = '#000';
    return;
  }

  function start() {
    if (FILM.TIMELINE) FILM.prepare(); // applies a timeline-declared fps before it is read
    const FPS = FILM.FPS;
    const duration = FILM.DURATION;
    const shotId = params.get('shot');
    const loopShot = shotId ? FILM.shotById(shotId) : null;
    const rangeStart = loopShot ? loopShot.start : 0;
    const rangeEnd = loopShot ? loopShot.end : duration;
    const tParam = params.get('t');

    const style = document.createElement('style');
    style.textContent = [
      'html,body{margin:0;height:100%;background:#000;overflow:hidden}',
      'body{display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-user-select:none;user-select:none}',
      `#film{display:block;height:min(100vh,calc(100vw*${FILM.H}/${FILM.W}));width:auto;` +
        `aspect-ratio:${FILM.W}/${FILM.H};background:#000}`,
      '#hud{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;font:12px/1.4 ui-monospace,Menlo,monospace;color:#bbb;',
      'display:flex;justify-content:space-between;pointer-events:none;transition:opacity .4s;text-shadow:0 1px 2px #000}',
      '#bar{position:fixed;left:0;bottom:0;height:2px;background:#e8e0cf;width:0;pointer-events:none}',
      'body.playing #hud{opacity:0}',
      'body.playing:hover #hud{opacity:.85}',
    ].join('');
    document.head.appendChild(style);

    const canvas = document.createElement('canvas');
    canvas.id = 'film';
    document.body.appendChild(canvas);
    FILM.mount(canvas);

    const hud = document.createElement('div');
    hud.id = 'hud';
    const left = document.createElement('span');
    const right = document.createElement('span');
    right.textContent = 'click or space: play/pause   ← →: step';
    hud.appendChild(left);
    hud.appendChild(right);
    document.body.appendChild(hud);
    const bar = document.createElement('div');
    bar.id = 'bar';
    document.body.appendChild(bar);

    let T = tParam != null && isFinite(Number(tParam)) ? Number(tParam) : rangeStart;
    let playing = false;
    let audio = null; // { ctx, anchor, startT }
    let rafStamp0 = null;
    let rafT0 = 0;
    let lastDrawn = -1;

    const quant = (t) => Math.floor(t * FPS + 1e-6) / FPS;

    function draw(force) {
      const q = quant(Math.min(Math.max(T, rangeStart), rangeEnd - 1 / FPS));
      if (!force && q === lastDrawn) return;
      lastDrawn = q;
      FILM.errors = [];
      const shot = FILM.renderFrame(q);
      if (FILM.errors.length && window.console) console.warn('FILM errors at', q, FILM.errors);
      left.textContent = `${q.toFixed(2)}s  f${Math.round(q * FPS)}  ${shot ? shot.id : ''}`;
      bar.style.width = `${(100 * (q - rangeStart)) / Math.max(1e-6, rangeEnd - rangeStart)}%`;
    }

    function stopAudio() {
      if (audio) {
        const c = audio.ctx;
        audio = null;
        c.close();
      }
    }

    function startAudio(fromT) {
      stopAudio();
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || !FILM.audio || typeof FILM.audio.render !== 'function') return;
      const ctx = new AC({ latencyHint: 'playback', sampleRate: 48000 });
      const master = ctx.createGain();
      master.connect(ctx.destination);
      const anchor = ctx.currentTime;
      try {
        FILM.audio.render(ctx, { start: fromT, dest: master });
      } catch (e) {
        if (window.console) console.error('FILM.audio.render failed', e);
      }
      audio = { ctx, anchor, startT: fromT };
    }

    function play() {
      if (T >= rangeEnd - 1 / FPS) T = rangeStart;
      playing = true;
      document.body.classList.add('playing');
      startAudio(T);
      rafStamp0 = null;
      rafT0 = T;
    }

    function pause() {
      playing = false;
      document.body.classList.remove('playing');
      stopAudio();
      T = quant(T);
      draw(true);
    }

    function tick(stamp) {
      if (playing) {
        if (audio) {
          const lat = (audio.ctx.baseLatency || 0) + (audio.ctx.outputLatency || 0);
          T = audio.startT + Math.max(0, audio.ctx.currentTime - audio.anchor - lat);
        } else {
          if (rafStamp0 == null) rafStamp0 = stamp;
          T = rafT0 + (stamp - rafStamp0) / 1000;
        }
        if (T >= rangeEnd) {
          T = rangeStart;
          if (audio) startAudio(T);
          rafStamp0 = stamp;
          rafT0 = T;
        }
        draw(false);
      }
      window.requestAnimationFrame(tick);
    }

    function step(n) {
      if (playing) pause();
      const f = Math.round(quant(T) * FPS) + n;
      const f0 = Math.round(rangeStart * FPS);
      const f1 = Math.round(rangeEnd * FPS) - 1;
      T = Math.min(f1, Math.max(f0, f)) / FPS;
      draw(true);
    }

    canvas.addEventListener('click', () => (playing ? pause() : play()));
    document.body.addEventListener('click', (e) => {
      if (e.target === document.body) playing ? pause() : play();
    });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        playing ? pause() : play();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        step(1);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        step(-1);
      }
    });

    draw(true);
    window.requestAnimationFrame(tick);
  }

  // Photos decode asynchronously and the hand-lettering face resolves asynchronously; drawing before
  // either is ready shows a half-built frame (and hashes differently from the same frame drawn later).
  const boot = () =>
    Promise.all([
      FILM.loadPhotos ? FILM.loadPhotos() : Promise.resolve(),
      document.fonts ? document.fonts.ready : Promise.resolve(),
    ]).then(start);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
